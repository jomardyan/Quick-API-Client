name: Validate extension
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Extension version included in the verified ZIP
        value: ${{ jobs.validate.outputs.version }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./release.sh --no-bump
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - id: version
        run: echo "value=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"
      - name: Upload store-ready ZIP without wrapping it in another archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/quick-api-client-v${{ steps.version.outputs.value }}.zip
          archive: false
          if-no-files-found: error
